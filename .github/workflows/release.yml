name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------ Windows ------------------------------
  build-windows:
    name: Windows NSIS 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # Windows 上 Tauri 自动调用 NSIS 生成安装包（runner 已自带 MSVC 与 WebView2）
      - name: 构建 Windows NSIS 安装包
        run: npm run tauri:build -- --bundles nsis

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: shotly-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ------------------------ macOS 双架构通用包 ------------------------
  build-macos:
    name: macOS 双架构通用包（Intel + Apple 芯片）
    runs-on: macos-latest
    env:
      # 仅用于链接/运行时最低版本，非空、安全
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 Intel + Apple 芯片双 target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 仅在仓库配置了 Apple 证书 secret 时，才把签名/公证变量导入环境。
      # 用 bash 内 [ -n "$X" ] 守卫，避免把空串传给 Tauri 导致 codesign -s "" 失败。
      # 不配置证书时这些变量完全不存在，Tauri 自动走 ad-hoc 签名（本地已验证可成功）。
      - name: 准备签名环境变量（可选）
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
          fi

      # 有证书才导入 keychain；无证书整段跳过，产物为 ad-hoc 签名
      - name: 导入签名证书（可选）
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p shotly build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p shotly build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k shotly build.keychain
          security find-identity -v -p codesigning build.keychain

      # 构建 universal 通用包：同时编译 aarch64 + x86_64，再用 lipo 合并为单包，
      # 产物（一个 DMG）在 Intel 与 Apple 芯片 Mac 上均可运行。
      - name: 构建 macOS 双架构通用包（universal）
        run: npm run tauri:build -- --target universal-apple-darwin --bundles dmg

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: shotly-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ------------------------ 汇总发布到 GitHub Release ------------------------
  release:
    name: 汇总发布
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 查看产物
        run: ls -lhR artifacts

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.dmg
          generate_release_notes: true
