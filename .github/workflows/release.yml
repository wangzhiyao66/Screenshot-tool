name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ------------------------------ Windows ------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # Windows 上 Tauri 需要 MSVC 生成工具与 WebView2（runner 已自带）
      - name: 构建 Windows 安装包
        run: npm run tauri:build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: shotly-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ------------------------------- macOS -------------------------------
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: "Apple 芯片"
            tag: "aarch64"
          - target: x86_64-apple-darwin
            arch: "Intel"
            tag: "x64"
    runs-on: macos-latest
    # 放到 job 层，下面的 if 条件才读得到
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（${{ matrix.target }}）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 有证书就签名公证，没有就跳过（产物是未签名的，首次打开需右键 → 打开）
      - name: 导入签名证书
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p shotly build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p shotly build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k shotly build.keychain
          security find-identity -v -p codesigning build.keychain

      # 只打 .app：Tauri 默认的 dmg 会调 AppleScript 排 Finder 窗口，
      # 在无 GUI 会话的 CI 上必然失败（-10004 权限违例）。dmg 改由 hdiutil 手工生成。
      - name: 构建 macOS 应用（${{ matrix.arch }}）
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles app

      - name: 生成 DMG（${{ matrix.arch }}）
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          STAGE=$(mktemp -d)
          cp -R "$BUNDLE_DIR/macos/Shotly.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p "$BUNDLE_DIR/dmg"
          hdiutil create \
            -volname "Shotly ${VERSION}" \
            -srcfolder "$STAGE" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "$BUNDLE_DIR/dmg/Shotly_${VERSION}_${{ matrix.tag }}.dmg"
          ls -lh "$BUNDLE_DIR/dmg/"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: shotly-macos-${{ matrix.tag }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
