name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 需要 contents: write 才能把诊断日志推到 ci-diag 分支
permissions:
  contents: write

jobs:
  # ------------------------------ Windows ------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # Windows 上 Tauri 需要 MSVC 生成工具与 WebView2（runner 已自带）
      - name: 构建 Windows 安装包
        run: npm run tauri:build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: shotly-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ------------------------------- macOS -------------------------------
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: "Apple 芯片"
            tag: "aarch64"
          - target: x86_64-apple-darwin
            arch: "Intel"
            tag: "x64"
    runs-on: macos-latest
    env:
      # 仅用于链接/运行时最低版本，非空、安全
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（${{ matrix.target }}）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 仅在仓库配置了 Apple 证书时才注入签名/公证变量。
      # 关键：未配置时必须「完全不设置」APPLE_SIGNING_IDENTITY，
      # 否则 Tauri 会拿空串去 codesign -s ""，导致打包失败。
      # 不设置时 Tauri 自动走 ad-hoc 签名（本地已验证可成功）。
      - name: 准备签名环境变量
        if: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"

      # 有证书才执行；无证书时整段跳过（产物为 ad-hoc 签名，首次打开需右键 → 打开）
      - name: 导入签名证书
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p shotly build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p shotly build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k shotly build.keychain
          security find-identity -v -p codesigning build.keychain

      # 只打 .app：Tauri 默认的 dmg 会调 AppleScript 排 Finder 窗口，
      # 在无 GUI 会话的 CI 上必然失败（-10004 权限违例）。dmg 改由 hdiutil 手工生成。
      # 输出同时写入诊断日志，失败时提交到 ci-diag 分支供排查。
      - name: 构建 macOS 应用（${{ matrix.arch }}）
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles app > ci-diag-${{ matrix.tag }}.log 2>&1

      - name: 生成 DMG（${{ matrix.arch }}）
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          STAGE=$(mktemp -d)
          cp -R "$BUNDLE_DIR/macos/Shotly.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p "$BUNDLE_DIR/dmg"
          hdiutil create \
            -volname "Shotly ${VERSION}" \
            -srcfolder "$STAGE" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "$BUNDLE_DIR/dmg/Shotly_${VERSION}_${{ matrix.tag }}.dmg" >> ci-diag-${{ matrix.tag }}.log 2>&1
          ls -lh "$BUNDLE_DIR/dmg/" >> ci-diag-${{ matrix.tag }}.log 2>&1

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: shotly-macos-${{ matrix.tag }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

      # 失败时把诊断日志推到 ci-diag 分支（孤儿分支，不污染主历史）
      - name: 上传诊断日志（失败时）
        if: failure()
        run: |
          git config user.email "ci@shotly.local"
          git config user.name "CI Diagnostics"
          git checkout --orphan ci-diag
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add ci-diag-${{ matrix.tag }}.log
          git commit -m "ci diag: ${{ matrix.target }} @ ${{ github.run_number }}"
          git push --force origin ci-diag
